# Netlify — Parche (landing + revista + Torker)
[build]
  command = "npm install --prefix apps/torker && npm run build"
  publish = "dist"

# SPA Torker
[[redirects]]
  from = "/torker"
  to = "/torker/index.html"
  status = 200

[[redirects]]
  from = "/torker/*"
  to = "/torker/index.html"
  status = 200

# URLs viejas
[[redirects]]
  from = "/pages/dashboard/app/*"
  to = "/torker/:splat"
  status = 301

[[redirects]]
  from = "/pages/dashboard/*"
  to = "/torker/login"
  status = 301

[[redirects]]
  from = "/pages/torker/*"
  to = "/torker/login"
  status = 301

[[redirects]]
  from = "/pages/revista/*"
  to = "/revista/:splat"
  status = 301

[[redirects]]
  from = "/pages/coming-soon.html"
  to = "/torker/login"
  status = 301
