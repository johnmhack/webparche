[build]
  publish = "."
  command = "echo 'No build step required - Updated 2025'"

[[redirects]]
  from = "/api/*"
  to = "https://webparche-production.up.railway.app/api/:splat"
  status = 200

[[redirects]]
  from = "/pages/torker/*"
  to = "https://webparche-production.up.railway.app/pages/torker/:splat"
  status = 200

[build.environment]
  # Force redeploy with timestamp
  UPDATED_AT = "2025-10-05-fix"