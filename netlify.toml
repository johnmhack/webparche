# Netlify configuration for static site
[build]
  publish = "."

# API redirects to Railway backend
[[redirects]]
  from = "/api/*"
  to = "https://webparche-production.up.railway.app/api/:splat"
  status = 200

[[redirects]]
  from = "/pages/torker/*"
  to = "https://webparche-production.up.railway.app/pages/torker/:splat"
  status = 200