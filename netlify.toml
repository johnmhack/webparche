[build]
  publish = "."
  command = "echo 'No build step required'"

[[redirects]]
  from = "/api/*"
  to = "https://[TU_DOMINIO_RAILWAY].up.railway.app/api/:splat"
  status = 200

[[redirects]]
  from = "/pages/torker/*"
  to = "https://[TU_DOMINIO_RAILWAY].up.railway.app/pages/torker/:splat"
  status = 200

[build.environment]
  NODE_VERSION = "18"