[phases.setup]
nixPkgs = ["python311", "python311Packages.pip", "python311Packages.setuptools"]

[phases.install]
cmds = [
  "python3.11 -m pip install --upgrade pip",
  "python3.11 -m pip install -r torker-backend/requirements.txt"
]

[phases.build]
cmds = [
  "cd torker-backend && python3.11 manage.py collectstatic --noinput",
  "cd torker-backend && python3.11 manage.py migrate --noinput"
]

[start]
cmd = "cd torker-backend && python3.11 manage.py runserver 0.0.0.0:$PORT"