[phases.setup]
nixPkgs = ["python39", "python39Packages.pip", "python39Packages.setuptools"]

[phases.install]
cmds = [
  "python3.9 -m pip install --upgrade pip",
  "python3.9 -m pip install -r torker-backend/requirements.txt"
]

[phases.build]
cmds = [
  "cd torker-backend && python3.9 manage.py collectstatic --noinput",
  "cd torker-backend && python3.9 manage.py migrate --noinput"
]

[start]
cmd = "cd torker-backend && python3.9 manage.py runserver 0.0.0.0:$PORT"