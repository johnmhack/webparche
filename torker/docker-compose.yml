version: '3.8'

services:
  torker-frontend:
    image: nginx:alpine
    container_name: torker-frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./:/var/www/html
      - ./ssl:/etc/nginx/ssl
    restart: unless-stopped
    networks:
      - torker-network

